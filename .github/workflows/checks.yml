name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每周一 03:00 UTC 检查上游是否漂移（文件被移动/重命名/行号过期）
    - cron: '0 3 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  links:
    name: 站内链接与锚点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 校验脚本本身零依赖；安装依赖只为验证站点能构建
      - name: Install build tooling
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: Check internal links and anchors
        run: node tools/check-links.mjs

      - name: Check site builds
        run: node tools/build-site.mjs

  upstream:
    name: 上游锚点漂移
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone upstream (shallow)
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git "$RUNNER_TEMP/upstream"

      # 校验脚本零依赖：这个 job 不需要 npm ci
      - name: Verify cited files and line ranges
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/check-upstream.mjs --upstream "$RUNNER_TEMP/upstream" 2>&1 | tee "$RUNNER_TEMP/drift.log"
          exit "${PIPESTATUS[0]}"

      - name: Open issue on drift
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_count=$(gh issue list --state open --search "上游漂移 in:title" --json number --jq 'length')
          if [ "$open_count" != "0" ]; then
            echo "已有未关闭的漂移 issue，跳过创建"
            exit 0
          fi

          {
            echo '`tools/check-upstream.mjs` 在最新上游上发现引用的文件已不存在（或行号超出范围）。'
            echo
            echo '<details><summary>检查输出（最后 80 行）</summary>'
            echo
            echo '```'
            tail -80 "$RUNNER_TEMP/drift.log" 2>/dev/null || true
            echo '```'
            echo
            echo '</details>'
            echo
            echo '### 复现'
            echo
            echo '```sh'
            echo 'git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git /tmp/upstream'
            echo 'node tools/check-upstream.mjs --upstream /tmp/upstream'
            echo '```'
            echo
            echo '### 修复清单（见 CONTRIBUTING.md）'
            echo
            echo '1. 用 `grep -rn "<被移动的符号>" packages/` 找到新位置；'
            echo '2. 更新 `days/`、`handbook.md`、`map.md`、`notes/` 中的 `path:line` 锚点；'
            echo '3. 若是教程行为变化，同步更新 `notes/doc-gaps.md` 的复核清单；'
            echo '4. 提交前跑 `node tools/check-links.mjs` 与 `node tools/check-upstream.mjs --upstream …`。'
          } > "$RUNNER_TEMP/issue.md"

          gh issue create \
            --title "上游漂移：笔记中引用的文件或行号已失效（$(date -u +%Y-%m-%d)）" \
            --body-file "$RUNNER_TEMP/issue.md"
        continue-on-error: true

      # issue 是长期信号，红叉是即时信号：两者都给
      - name: Fail job when drift is detected
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::上游锚点漂移，详见上方日志与新建 issue"
          exit 1

  pdf:
    name: 打印版 PDF（手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build tooling
        working-directory: tools
        run: npm ci --no-audit --no-fund

      - name: Generate PDFs
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/build-pdf.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: printable-pdfs
          path: dist/pdf/*.pdf
          retention-days: 30
